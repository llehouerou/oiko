name: Bug report
description: Something in Oiko does not work as it should.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `oiko -version`
      description: Oiko's version and each compiled-in type of Bridge with its version.
      render: text
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Before you paste logs or configuration:** they can hold tokens, host names, IP and MAC
        addresses, device serials and people's names. Replace them with made-up ones; this issue is
        public.
  - type: dropdown
    id: install
    attributes:
      label: How Oiko was installed
      options:
        - oiko-build
        - NixOS module
        - From source
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser
      description: When the web client is involved.
      placeholder: Firefox 140, Chrome 138 on Android…
