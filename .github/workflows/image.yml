name: Image

# The stock image of a release, ghcr.io/llehouerou/oiko:X.Y.Z and :X.Y (ADR 0057), built from
# the release tag's tree, which carries the web client (ADR 0018). By hand: publishes a tag again.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v0.12.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Labels from the checked-out tag, not from main when run by hand.
          context: git
          images: ghcr.io/llehouerou/oiko
          # Never latest: it would cross a breaking release (ADR 0019).
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oiko:smoke
      # The image knows its release and serves the dashboard, before anything is pushed.
      - name: Smoke test
        run: |
          version=$(docker run --rm oiko:smoke -version)
          echo "$version"
          grep -qxF "oiko $TAG" <<<"$version"
          mkdir data
          docker run -d --name oiko --network host --user "$(id -u):$(id -g)" -v "$PWD/data:/data" oiko:smoke
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          docker logs oiko
          exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
